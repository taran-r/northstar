[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar"
version = "0.1.0"
description = "Synthetic expert-trajectory generation for industrial rover navigation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "torch>=2.0.0",
  "tqdm>=4.65.0",
  "matplotlib>=3.7.0",
  "pyyaml>=6.0",
]

[project.scripts]
northstar-generate = "northstar.pipeline.cli:main"
northstar-validate = "northstar.pipeline.validate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["northstar*"]
